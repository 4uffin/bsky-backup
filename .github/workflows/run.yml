name: Backup

on:
  push:
  workflow_dispatch:
  schedule:
  - cron: "11 7 * * *" # daily at 7:11 AM UTC

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    if: ${{ !github.event.repository.is_template }}
    steps:
    - name: Install jq
      run: sudo apt-get install -y jq
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: "stable"
    - name: Create run.sh if it doesn't exist
      run: |
        [ -f "run.sh" ] && exit 0
        echo "#!/bin/bash" > run.sh
        if [[ "$REPO_DESC" == @* ]] || [[ "$REPO_DESC" == did:* ]]; then
          echo "./backup.sh $REPO_DESC" >> run.sh
        else
          echo "# ./backup.sh @bsky.app" >> run.sh
        fi
        chmod +x run.sh
        echo "Created run.sh"
        echo -e "# Scheduled Bluesky backup\n\nFor \`$REPO_DESC\`." > README.md 
      env:
        REPO_DESC: ${{ github.event.repository.description }}
    - name: Run the scraper
      run: |
        ./run.sh
    - name: Commit and push in batches
      run: |
        # The backup has never pushed successfully: the first push is
        # ~5,000 files and fails with HTTP 500 / "remote end hung up".
        # Commit and push in small batches (300 files each) so no single
        # push carries the whole export. Final repo state is identical
        # to a single `git add -A` commit; only the history differs.
        # Files over GitHub's 100 MB per-file limit are excluded from
        # the push entirely (GitHub rejects any push containing one)
        # and recorded in oversize-blobs.txt instead.
        set -e
        git config user.name "Automated"
        git config user.email "actions@users.noreply.github.com"
        git config http.postBuffer 524288000

        # Warn (do not delete or exclude) about any file over 90 MB:
        # GitHub rejects files over 100 MB outright and would block a push.
        echo "Checking for files over 90 MB (GitHub limit is 100 MB)..."
        find . -path ./.git -prune -o -type f -size +90M -print | while IFS= read -r big; do
          echo "::warning::File over 90 MB, close to GitHub's 100 MB limit and may block the push: $big ($(du -h "$big" | cut -f1))"
        done

        # Exclude files over 100 MB from the push: GitHub rejects any
        # push containing one. Record each (path + size) in
        # oversize-blobs.txt, which IS committed, so they are tracked,
        # not silently dropped. Each blob is content-addressed, so it
        # stays retrievable from Bluesky by its CID.
        oversize_list=$(mktemp)
        find . -path ./.git -prune -o -type f -size +100M -printf '%P\n' | sort > "$oversize_list"
        if [ -s "$oversize_list" ]; then
          {
            echo "# Files over GitHub's 100 MB per-file limit, excluded from this backup."
            echo "# Each blob is content-addressed and remains retrievable from Bluesky by its CID."
            echo "# Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "# path<TAB>size_bytes"
            while IFS= read -r big; do
              printf '%s\t%s\n' "$big" "$(stat -c%s -- "$big")"
            done < "$oversize_list"
          } > oversize-blobs.txt
          echo "::warning::$(wc -l < "$oversize_list") file(s) over 100 MB excluded from push; listed in oversize-blobs.txt"
        else
          # No oversize files: drop a stale manifest from a previous run, if any.
          rm -f oversize-blobs.txt
        fi

        push_with_retry() {
          local attempt=1
          while [ "$attempt" -le 3 ]; do
            if git push; then
              return 0
            fi
            echo "::warning::Push attempt $attempt failed; retrying..."
            if [ "$attempt" -lt 3 ]; then
              sleep 60
              # Pull --rebase needs a clean tree, so stash the
              # not-yet-committed batches, rebase, then restore them.
              git stash push -m "backup-batch-stash" --include-untracked || true
              git pull --rebase || true
              git stash pop || true
            fi
            attempt=$((attempt + 1))
          done
          echo "Push failed after 3 attempts" >&2
          return 1
        }

        # List every changed / new / deleted file individually
        # (git status collapses untracked directories, so use ls-files),
        # smallest first so small metadata / .car / .json files go in
        # the earliest batches and blob files follow in batches.
        # Files over 100 MB are skipped here (see oversize-blobs.txt).
        changed_list=$(mktemp)
        trap 'rm -f "$changed_list" "$oversize_list"' EXIT
        : > "$changed_list"
        while IFS= read -r -d '' path; do
          if grep -qxF -- "$path" "$oversize_list"; then
            continue
          fi
          if [ -f "$path" ]; then size=$(stat -c%s -- "$path"); else size=0; fi
          printf '%s\t%s\n' "$size" "$path" >> "$changed_list"
        done < <(git ls-files --others --modified --deleted --exclude-standard -z)
        sort -n -t "$(printf '\t')" -k1,1 "$changed_list" -o "$changed_list"

        batch_size=300
        count=0
        batch_num=1
        declare -a batch_files=()
        commit_batch() {
          if [ "${#batch_files[@]}" -eq 0 ]; then return 0; fi
          git add -- "${batch_files[@]}"
          if git diff --cached --quiet; then
            echo "Batch $batch_num: nothing staged, skipping"
            batch_files=(); count=0
            return 0
          fi
          git commit -m "Backup $(date -u +%Y-%m-%dT%H:%M:%SZ) (batch $batch_num)"
          push_with_retry
          echo "Batch $batch_num pushed: ${#batch_files[@]} files"
          batch_files=(); count=0; batch_num=$((batch_num + 1))
        }

        while IFS="$(printf '\t')" read -r _size path; do
          batch_files+=("$path"); count=$((count + 1))
          if [ "$count" -ge "$batch_size" ]; then commit_batch; fi
        done < "$changed_list"
        commit_batch
        echo "Done: $((batch_num - 1)) batch(es) pushed"
